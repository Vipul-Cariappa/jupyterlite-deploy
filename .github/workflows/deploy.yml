name: Build and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install mamba
        uses: mamba-org/setup-micromamba@v3
        with:
          micromamba-version: '2.9.0-0'
          environment-file: build-environment.yml
          cache-environment: true

      - name: Setup emsdk
        uses: mymindstorm/setup-emsdk@v16
        with:
          version: 4.0.9

      - name: Create the wasm kernel environment
        shell: bash -l {0}
        run: |
          micromamba create -y -f environment.yml --platform=emscripten-wasm32

          # Pure-python wheels the python kernel needs
          python -m pip install --no-deps --target \
            "$MAMBA_ROOT_PREFIX/envs/xeus-kernels/lib/python3.13/site-packages" \
            py-logic

      - name: Build the KariLang kernel
        shell: bash -l {0}
        run: |
          git clone --recurse-submodules https://github.com/Vipul-Cariappa/KariLang-Kernel.git
          cd KariLang-Kernel

          export PREFIX=$MAMBA_ROOT_PREFIX/envs/xeus-kernels
          export CMAKE_PREFIX_PATH=$PREFIX
          export CMAKE_SYSTEM_PREFIX_PATH=$PREFIX

          emcmake cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=ON \
            -DCMAKE_INSTALL_PREFIX=$PREFIX \
            .
          emmake make -C build -j $(nproc) install

      - name: Build the JupyterLite site
        shell: bash -l {0}
        run: |
          cp README.md content
          jupyter lite build \
            --contents content \
            --output-dir dist \
            --XeusAddon.prefix=$MAMBA_ROOT_PREFIX/envs/xeus-kernels

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
