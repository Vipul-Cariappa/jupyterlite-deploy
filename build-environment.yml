name: build-env
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - jupyter_server
  - cmake
  - make
  # reads environment.yml in the workflow
  - pyyaml
  # Native LLVM, only so cppinterop-tblgen can be built: it turns CppInterOp's
  # .td into .inc at build time and cannot run under emscripten. Same version as
  # the wasm llvm the kernel links against.
  - llvmdev==22.1.8
  - pip:
    - jupyterlite-core==0.8.3
    - jupyterlab~=4.6.0
    - notebook~=7.6.0
    - jupyterlite-xeus==5.0.0
    
    # Python kernel
    - jupyterlite-pyodide-kernel==0.8.5

    # JavaScript kernel
    - jupyterlite-javascript-kernel==0.3.0

    # P5 kernel
    - jupyterlite-p5-kernel==0.3.0

    # JupyterLab: dark theme
    - jupyterlab-night
